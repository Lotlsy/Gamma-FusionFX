<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FusionFX | Admin — Orders</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ---- Admin-specific overrides ---- */
    .admin-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 57px);
    }
    @media (max-width: 700px) { .admin-layout { grid-template-columns: 1fr; } }

    /* Sidebar */
    .admin-sidebar {
      background: var(--navy-card);
      border-right: 1px solid var(--navy-border);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .sidebar-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0.75rem 0.6rem 0.3rem;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: 'DM Sans', sans-serif;
    }
    .sidebar-link:hover { background: var(--gold-dim); color: var(--gold); transform: none; filter: none; }
    .sidebar-link.active { background: var(--gold-dim); color: var(--gold); border-left: 2px solid var(--gold); }
    .sidebar-link .icon { font-size: 1rem; width: 20px; text-align: center; }

    /* Main content */
    .admin-main { padding: 1.75rem 2rem; overflow-y: auto; }

    /* Stat cards */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    .stat-card {
      background: var(--navy-card);
      border: 1px solid var(--navy-border);
      border-radius: 14px;
      padding: 1.1rem 1.25rem;
      transition: border-color 0.2s;
    }
    .stat-card:hover { border-color: rgba(201,168,76,0.25); }
    .stat-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .stat-value {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }
    .stat-value .unit { font-size: 0.85rem; color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-weight: 400; }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-input {
      flex: 1;
      min-width: 200px;
      background: var(--navy-card);
      border: 1px solid var(--navy-border);
      border-radius: 10px;
      padding: 0.55rem 0.9rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      transition: border-color 0.2s;
    }
    .search-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
    .search-input::placeholder { color: var(--text-muted); }

    .status-filter {
      background: var(--navy-card);
      border: 1px solid var(--navy-border);
      border-radius: 10px;
      padding: 0.55rem 0.9rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
    }
    .status-filter:focus { outline: none; border-color: var(--gold); }
    .status-filter option { background: var(--navy-card); }

    /* Table */
    .table-wrap {
      background: var(--navy-card);
      border: 1px solid var(--navy-border);
      border-radius: 14px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: rgba(201,168,76,0.06);
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--navy-border);
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid var(--navy-border);
      transition: background 0.15s;
      cursor: pointer;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(201,168,76,0.04); }
    tbody td {
      padding: 0.85rem 1rem;
      font-size: 0.875rem;
      color: var(--text);
      vertical-align: middle;
    }
    .td-muted { color: var(--text-muted); font-size: 0.8rem; }
    .td-mono { font-family: monospace; font-size: 0.8rem; color: var(--text-muted); }

    /* Status badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.55rem;
      border-radius: 5px;
    }
    .status-badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .s-confirmed { background: rgba(99,102,241,0.15); color: #818cf8; }
    .s-pending   { background: rgba(251,191,36,0.15);  color: #fbbf24; }
    .s-shipped   { background: rgba(14,165,233,0.15);  color: #38bdf8; }
    .s-delivered { background: rgba(74,222,128,0.15);  color: #4ade80; }
    .s-cancelled { background: rgba(248,113,113,0.15); color: #f87171; }

    /* Action buttons */
    .row-actions { display: flex; gap: 0.4rem; }
    .act-btn {
      background: transparent;
      border: 1px solid var(--navy-border);
      color: var(--text-muted);
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .act-btn:hover { border-color: var(--gold); color: var(--gold); transform: none; filter: none; }
    .act-btn.danger:hover { border-color: #f87171; color: #f87171; }

    /* Order detail panel */
    .detail-panel {
      position: fixed;
      top: 0; right: 0;
      height: 100vh;
      width: 380px;
      background: var(--navy-card);
      border-left: 1px solid rgba(201,168,76,0.2);
      padding: 1.5rem;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      z-index: 150;
    }
    .detail-panel.open { transform: translateX(0); }
    @media (max-width: 700px) { .detail-panel { width: 100%; } }

    .panel-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: transparent;
      border: 1px solid var(--navy-border);
      color: var(--text-muted);
      width: 30px; height: 30px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
    }
    .panel-close:hover { color: var(--text); border-color: var(--text-muted); filter: none; transform: none; }

    .panel-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      margin-bottom: 0.15rem;
    }
    .panel-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.25rem; }

    .detail-section { margin-bottom: 1.25rem; }
    .detail-section-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 0.3rem 0;
      border-bottom: 1px solid var(--navy-border);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .label { color: var(--text-muted); }

    .item-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid var(--navy-border);
    }
    .item-line:last-child { border-bottom: none; }
    .item-line .iname { color: var(--text); }
    .item-line .iprice { color: var(--gold); font-weight: 600; }

    .status-select {
      background: var(--navy-mid);
      border: 1px solid var(--navy-border);
      border-radius: 8px;
      padding: 0.45rem 0.7rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      width: 100%;
      margin-bottom: 0.75rem;
    }
    .status-select:focus { outline: none; border-color: var(--gold); }
    .status-select option { background: var(--navy-mid); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-muted);
    }
    .empty-state .big { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.4; }
    .empty-state p { font-size: 0.875rem; }

    /* Dim overlay when panel open */
    .dim-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 140;
      display: none;
    }
    .dim-overlay.show { display: block; }

    /* Revenue chart bar */
    .mini-bar-wrap { display: flex; align-items: flex-end; gap: 4px; height: 48px; margin-top: 0.4rem; }
    .mini-bar {
      flex: 1;
      background: var(--gold-dim);
      border-radius: 3px 3px 0 0;
      border-bottom: 2px solid var(--gold);
      transition: height 0.4s ease;
    }

    /* Pagination */
    .pagination {
      display: flex;
      gap: 0.4rem;
      justify-content: flex-end;
      margin-top: 1rem;
      align-items: center;
    }
    .page-btn {
      background: var(--navy-card);
      border: 1px solid var(--navy-border);
      color: var(--text-muted);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .page-btn:hover, .page-btn.active { border-color: var(--gold); color: var(--gold); filter: none; transform: none; }
    .page-info { font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      ⚡ FusionFX <span>Admin</span>
      <small>Order Management</small>
    </div>
    <nav>
      <a href="index.html">Currency</a>
      <a href="metals.html">Metals</a>
      <a href="shop.html">Shop</a>
      <a href="admin.html" class="active">Admin</a>
    </nav>
    <button id="themeToggle" class="theme-btn">☀ / 🌙</button>
  </header>

  <div class="admin-layout">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="sidebar-label">Dashboard</div>
      <button class="sidebar-link active" onclick="showView('orders')">
        <span class="icon">📦</span> Orders
      </button>
      <button class="sidebar-link" onclick="showView('stats')">
        <span class="icon">📊</span> Analytics
      </button>

      <div class="sidebar-label" style="margin-top:0.75rem">Data</div>
      <button class="sidebar-link" onclick="exportCSV()">
        <span class="icon">⬇</span> Export CSV
      </button>
      <button class="sidebar-link" onclick="confirmSeed()">
        <span class="icon">🌱</span> Seed Demo Data
      </button>
      <button class="sidebar-link danger" onclick="confirmClear()" style="margin-top:auto">
        <span class="icon">🗑</span> Clear All Orders
      </button>
    </aside>

    <!-- Main -->
    <main class="admin-main">

      <!-- Stats view -->
      <div id="statsView" style="display:none">
        <h2 style="font-family:'Playfair Display',serif;margin-bottom:1.25rem">Analytics</h2>
        <div class="stat-row" id="statsRow"></div>
        <div class="glass-card" style="margin-top:0">
          <h3 class="section-title">Revenue — Last 7 Days</h3>
          <div class="mini-bar-wrap" id="revenueChart"></div>
          <div style="display:flex;justify-content:space-between;margin-top:0.3rem;font-size:0.7rem;color:var(--text-muted)" id="revenueLabels"></div>
        </div>
      </div>

      <!-- Orders view (default) -->
      <div id="ordersView">
        <h2 style="font-family:'Playfair Display',serif;margin-bottom:1.25rem">All Orders</h2>

        <!-- Stat strip -->
        <div class="stat-row" id="quickStats"></div>

        <!-- Toolbar -->
        <div class="toolbar">
          <input  class="search-input"  id="searchInput"  type="text" placeholder="🔍  Search by name, email, order ID…" oninput="onSearch()">
          <select class="status-filter" id="statusFilter" onchange="onSearch()">
            <option value="">All statuses</option>
            <option value="confirmed">Confirmed</option>
            <option value="pending">Pending</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <!-- Table -->
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Date</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr><td colspan="7"><div class="empty-state"><div class="big">📭</div><p>No orders yet.</p></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="paginationEl"></div>
      </div>

    </main>
  </div>

  <!-- Order detail panel -->
  <div class="dim-overlay" id="dimOverlay" onclick="closePanel()"></div>
  <aside class="detail-panel" id="detailPanel">
    <button class="panel-close" onclick="closePanel()">✕</button>
    <div id="panelContent"></div>
  </aside>

  <footer>
    <p>© 2026 FusionFX Admin &nbsp;·&nbsp; Data stored locally via IndexedDB</p>
  </footer>

  <script src="db.js"></script>
  <script>
    // ==================== Theme ====================
    const themeToggle = document.getElementById("themeToggle");
    if (localStorage.getItem("theme") === "light") document.body.classList.add("light-mode");
    themeToggle?.addEventListener("click", () => {
      document.body.classList.toggle("light-mode");
      localStorage.setItem("theme", document.body.classList.contains("light-mode") ? "light" : "dark");
    });

    // ==================== State ====================
    let allOrders   = [];
    let filteredOrders = [];
    const PAGE_SIZE = 10;
    let currentPage = 1;

    // ==================== Init ====================
    async function init() {
      await seedDemoData();
      allOrders = await getAllOrders();
      filteredOrders = [...allOrders];
      renderQuickStats();
      renderTable();
    }

    // ==================== Views ====================
    function showView(view) {
      document.getElementById("ordersView").style.display = view === "orders" ? "" : "none";
      document.getElementById("statsView").style.display  = view === "stats"  ? "" : "none";
      document.querySelectorAll(".sidebar-link").forEach(l => l.classList.remove("active"));
      event.currentTarget.classList.add("active");
      if (view === "stats") renderAnalytics();
    }

    // ==================== Stats strip ====================
    function renderQuickStats() {
      const total   = allOrders.reduce((s, o) => s + (o.total || 0), 0);
      const count   = allOrders.length;
      const avg     = count ? total / count : 0;
      const shipped = allOrders.filter(o => o.status === "shipped" || o.status === "delivered").length;

      document.getElementById("quickStats").innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value"><span class="unit">$</span>${total.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Orders</div>
          <div class="stat-value">${count}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg Order Value</div>
          <div class="stat-value"><span class="unit">$</span>${avg.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Shipped / Delivered</div>
          <div class="stat-value">${shipped}</div>
        </div>
      `;
    }

    // ==================== Table ====================
    function renderTable() {
      const tbody = document.getElementById("ordersBody");
      const start = (currentPage - 1) * PAGE_SIZE;
      const page  = filteredOrders.slice(start, start + PAGE_SIZE);

      if (filteredOrders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="big">🔍</div><p>No orders match your search.</p></div></td></tr>`;
        document.getElementById("paginationEl").innerHTML = "";
        return;
      }

      tbody.innerHTML = page.map(o => `
        <tr onclick="openPanel(${o.id})">
          <td class="td-mono">#${String(o.id).padStart(4,'0')}</td>
          <td class="td-muted">${formatDate(o.createdAt)}</td>
          <td>
            <div style="font-weight:600">${escHtml(o.name)}</div>
            <div class="td-muted">${escHtml(o.email)}</div>
          </td>
          <td class="td-muted">${o.items?.length ?? 0} item${o.items?.length !== 1 ? 's' : ''}</td>
          <td><strong>$${(o.total||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</strong></td>
          <td><span class="status-badge s-${o.status}">${o.status}</span></td>
          <td onclick="event.stopPropagation()">
            <div class="row-actions">
              <button class="act-btn" onclick="openPanel(${o.id})">View</button>
              <button class="act-btn danger" onclick="confirmDelete(${o.id})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');

      renderPagination();
    }

    function renderPagination() {
      const total = Math.ceil(filteredOrders.length / PAGE_SIZE);
      const el    = document.getElementById("paginationEl");
      if (total <= 1) { el.innerHTML = ""; return; }

      let html = `<span class="page-info">${filteredOrders.length} orders</span>`;
      for (let i = 1; i <= total; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }
      el.innerHTML = html;
    }

    function goPage(n) {
      currentPage = n;
      renderTable();
    }

    // ==================== Search & Filter ====================
    async function onSearch() {
      const q      = document.getElementById("searchInput").value.trim();
      const status = document.getElementById("statusFilter").value;
      let results  = q ? await searchOrders(q) : [...allOrders];
      if (status) results = results.filter(o => o.status === status);
      filteredOrders = results;
      currentPage = 1;
      renderTable();
    }

    // ==================== Detail Panel ====================
    async function openPanel(id) {
      const o = await getOrderById(id);
      if (!o) return;

      document.getElementById("panelContent").innerHTML = `
        <div class="panel-title">Order #${String(o.id).padStart(4,'0')}</div>
        <div class="panel-meta">${formatDateTime(o.createdAt)}</div>

        <div class="detail-section">
          <div class="detail-section-title">Status</div>
          <select class="status-select" id="panelStatus" onchange="updateStatus(${o.id}, this.value)">
            ${['confirmed','pending','shipped','delivered','cancelled'].map(s =>
              `<option value="${s}" ${o.status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`
            ).join('')}
          </select>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">Customer</div>
          <div class="detail-row"><span class="label">Name</span><span>${escHtml(o.name)}</span></div>
          <div class="detail-row"><span class="label">Email</span><span>${escHtml(o.email)}</span></div>
          <div class="detail-row"><span class="label">Address</span><span style="text-align:right;max-width:200px">${escHtml(o.address)}</span></div>
          <div class="detail-row"><span class="label">Card</span><span>•••• ${o.cardLast4 || '????'}</span></div>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">Items</div>
          ${(o.items||[]).map(i => `
            <div class="item-line">
              <div>
                <div class="iname">${escHtml(i.name)}</div>
                <div style="font-size:0.75rem;color:var(--text-muted)">${escHtml(i.weight||'')}</div>
              </div>
              <div class="iprice">$${(i.price||0).toFixed(2)}</div>
            </div>`).join('')}
        </div>

        <div class="detail-section">
          <div class="detail-section-title">Order Summary</div>
          <div class="detail-row"><span class="label">Subtotal</span><span>$${(o.subtotal||0).toFixed(2)}</span></div>
          <div class="detail-row"><span class="label">Dealer premium</span><span>$${(o.premium||0).toFixed(2)}</span></div>
          <div class="detail-row"><span class="label">Shipping</span><span>$${(o.shipping||0).toFixed(2)}</span></div>
          <div class="detail-row" style="font-weight:700;color:var(--text)"><span>Total</span><span style="color:var(--gold)">$${(o.total||0).toFixed(2)}</span></div>
        </div>
      `;

      document.getElementById("detailPanel").classList.add("open");
      document.getElementById("dimOverlay").classList.add("show");
    }

    function closePanel() {
      document.getElementById("detailPanel").classList.remove("open");
      document.getElementById("dimOverlay").classList.remove("show");
    }

    async function updateStatus(id, status) {
      await updateOrderStatus(id, status);
      allOrders = await getAllOrders();
      filteredOrders = [...allOrders];
      renderQuickStats();
      renderTable();
    }

    // ==================== Delete ====================
    async function confirmDelete(id) {
      if (!confirm(`Delete order #${String(id).padStart(4,'0')}? This cannot be undone.`)) return;
      await deleteOrder(id);
      closePanel();
      allOrders = await getAllOrders();
      filteredOrders = [...allOrders];
      renderQuickStats();
      renderTable();
    }

    // ==================== Analytics view ====================
    async function renderAnalytics() {
      const stats = await getStats();
      document.getElementById("statsRow").innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value"><span class="unit">$</span>${stats.total.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Orders</div>
          <div class="stat-value">${stats.count}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg Order Value</div>
          <div class="stat-value"><span class="unit">$</span>${stats.avgVal.toFixed(2)}</div>
        </div>
        ${Object.entries(stats.statuses).map(([s,n]) => `
          <div class="stat-card">
            <div class="stat-label">${s.charAt(0).toUpperCase()+s.slice(1)}</div>
            <div class="stat-value">${n}</div>
          </div>`).join('')}
      `;

      // Build 7-day revenue bars
      const days   = [];
      const labels = [];
      const totals = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0, 10);
        days.push(key);
        labels.push(d.toLocaleDateString('en', {weekday:'short'}));
        totals.push(allOrders.filter(o => o.createdAt?.slice(0,10) === key).reduce((s,o) => s+(o.total||0), 0));
      }
      const maxVal = Math.max(...totals, 1);
      document.getElementById("revenueChart").innerHTML =
        totals.map(v => `<div class="mini-bar" style="height:${Math.max(4, (v/maxVal)*100)}%"></div>`).join('');
      document.getElementById("revenueLabels").innerHTML =
        labels.map(l => `<span>${l}</span>`).join('');
    }

    // ==================== Export CSV ====================
    async function exportCSV() {
      const orders = await getAllOrders();
      if (!orders.length) { alert("No orders to export."); return; }
      const header = ["ID","Date","Name","Email","Address","Card Last4","Items","Subtotal","Premium","Shipping","Total","Status"];
      const rows   = orders.map(o => [
        o.id,
        formatDate(o.createdAt),
        `"${(o.name||'').replace(/"/g,'""')}"`,
        `"${(o.email||'').replace(/"/g,'""')}"`,
        `"${(o.address||'').replace(/"/g,'""')}"`,
        o.cardLast4 || '',
        o.items?.length ?? 0,
        (o.subtotal||0).toFixed(2),
        (o.premium||0).toFixed(2),
        (o.shipping||0).toFixed(2),
        (o.total||0).toFixed(2),
        o.status
      ]);
      const csv  = [header, ...rows].map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a    = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = `fusionfx_orders_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

        { name:"Wei Ming Chen",   email:"weiming@corp.sg",   address:"Orchard Road, Singapore 238888",         cardLast4:"9900", status:"delivered",  items:[{name:"Canadian Maple Leaf",weight:"1 troy oz",price:3428.16},{name:"Gold Certificate (10g)",weight:"10 grams",price:1079.93}],subtotal:4508.09,premium:112.70,shipping:25,total:4645.79},

      for (let i = 0; i < demoOrders.length; i++) {

      }
      allOrders = await getAllOrders();

    async function confirmClear() {
      if (!confirm("Delete ALL orders permanently? This cannot be undone.")) return;
      const all = await getAllOrders();
      for (const o of all) await deleteOrder(o.id);
      allOrders = [];
      filteredOrders = [];
      renderQuickStats();
      renderTable();
      closePanel();
    }

    // ==================== Utils ====================
    function formatDate(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
    }
    function formatDateTime(iso) {
      if (!iso) return "—";
      return new Date(iso).toLocaleString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    }
    function escHtml(str) {
      return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ==================== Boot ====================
    init();
  </script>
